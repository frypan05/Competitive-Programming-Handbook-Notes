name: Generate Content Index

on:
    push:
        branches:
            - main
            - master
        paths:
            - "DevOps/**"
            - "Networking/**"
            - "Linux/**"
            - "Nginx/**"
            - "OpsProject/scripts/generate-index.py"
    pull_request:
        branches:
            - main
            - master
        paths:
            - "DevOps/**"
            - "Networking/**"
            - "Linux/**"
            - "Nginx/**"
    workflow_dispatch:
    schedule:
        # Run daily at 00:00 UTC to catch any missed updates
        - cron: "0 0 * * *"

# Prevent concurrent runs
concurrency:
    group: content-index-${{ github.ref }}
    cancel-in-progress: true

jobs:
    generate-index:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        # Only run this job if the commit message doesn't contain [skip ci]
        if: "!contains(github.event.head_commit.message, '[skip ci]')"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies (if any)
              run: |
                  python -m pip install --upgrade pip
                  # Add any dependencies if needed in the future
                  # pip install -r requirements.txt

            - name: Generate content index
              run: |
                  python OpsProject/scripts/generate-index.py

            - name: Check for changes
              id: git-check
              run: |
                  git diff --exit-code OpsProject/site/content-index.json || echo "changed=true" >> $GITHUB_OUTPUT

            - name: Commit and push if changed
              if: steps.git-check.outputs.changed == 'true'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add OpsProject/site/content-index.json
                  git commit -m "chore: update content index [skip ci]"

                  # Push with retry logic to handle potential conflicts
                  MAX_RETRIES=3
                  RETRY_COUNT=0

                  while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                    if git push; then
                      echo " Successfully pushed changes"
                      break
                    else
                      RETRY_COUNT=$((RETRY_COUNT + 1))
                      if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                        echo " Push failed, retrying... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                        git pull --rebase
                      else
                        echo "❌ Failed to push after $MAX_RETRIES attempts"
                        exit 1
                      fi
                    fi
                  done

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: content-index
                  path: OpsProject/site/content-index.json
                  retention-days: 30

            - name: Summary
              run: |
                  echo "## Content Index Generation Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  if [ -f OpsProject/site/content-index.json ]; then
                    TOTAL=$(jq '.total_items' OpsProject/site/content-index.json)
                    echo " Successfully generated content index" >> $GITHUB_STEP_SUMMARY
                    echo " Total items indexed: **$TOTAL**" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "### Categories:" >> $GITHUB_STEP_SUMMARY
                    jq -r '.categories | to_entries[] | "- **\(.key)**: \(.value.count) items"' OpsProject/site/content-index.json >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ Failed to generate content index" >> $GITHUB_STEP_SUMMARY
                  fi
