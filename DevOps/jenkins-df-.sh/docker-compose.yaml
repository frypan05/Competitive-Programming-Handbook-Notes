version: "3.8"
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-alpine-jdk2
    container_name: jenkins
    restart: always
    ports:
      - 8080:8080
      - 50000:50000
    user: jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
