<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" style="font-family: Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50" />
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width:2; rx:8; ry:8; }
      .edge { fill: #f8f9fa; stroke: #6c7a89; stroke-width:1; rx:6; ry:6; }
      .title { font-size:18px; font-weight:bold; fill:#1f2d3d; }
      .label { font-size:14px; fill:#1f2d3d; }
      .small { font-size:12px; fill:#2c3e50; }
      .note { font-size:12px; fill:#34495e; }
      .protocol { font-size:12px; font-style:italic; fill:#2c3e50; }
      .bg { fill:#ecf0f1; }
      .cloud { fill:#ffffff; stroke:#2c3e50; stroke-dasharray:6 4; stroke-width:1.5; rx:20; ry:20; }
      .section-title { font-size:16px; font-weight:700; fill:#0b3d91; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="2200" class="bg" />

  <!-- Diagram Title -->
  <text x="60" y="48" class="title">Network Flow: How the Internet Works (detailed)</text>
  <text x="60" y="78" class="small">Includes DNS, IP routing, TCP/TLS handshakes, HTTP/HTTPS, LB, CDN, Firewalls, Proxies, VPN/SSH, NAT, and PKI</text>

  <!-- CLIENT -->
  <g id="client">
    <rect x="60" y="110" width="300" height="120" class="box"/>
    <text x="80" y="140" class="label">Client (Browser / App)</text>
    <text x="80" y="162" class="small">- Stub resolver / OS cache</text>
    <text x="80" y="180" class="small">- Source IP: ephemeral port</text>

    <!-- client actions -->
    <rect x="60" y="240" width="300" height="120" class="edge"/>
    <text x="80" y="272" class="label">Local Network / NAT Router</text>
    <text x="80" y="292" class="small">- ARP / NDP for MAC resolution</text>
    <text x="80" y="310" class="small">- NAT (PAT) for private → public</text>
  </g>

  <!-- DNS -->
  <g id="dns">
    <rect x="420" y="110" width="420" height="120" class="box"/>
    <text x="440" y="140" class="label">DNS: Recursive Resolver</text>
    <text x="440" y="160" class="small">- UDP/53 (query) | TCP/53 fallback</text>
    <text x="440" y="180" class="small">- DoH (HTTPS) or DoT (TLS/853) for privacy</text>

    <rect x="420" y="240" width="420" height="80" class="edge"/>
    <text x="440" y="274" class="small">Root → TLD → Authoritative (iterative) — TTL and DNSSEC</text>
  </g>

  <!-- INTERNET / BGP CLOUD -->
  <g id="internet-cloud">
    <ellipse cx="880" cy="420" rx="520" ry="120" class="cloud"/>
    <text x="520" y="380" class="section-title">Internet / Backbone</text>
    <text x="520" y="404" class="small">- BGP routing between ASes</text>
    <text x="520" y="424" class="small">- Longest-prefix match and AS-path policies</text>
    <text x="520" y="444" class="small">- MTU / Path MTU discovery, TTL</text>
  </g>

  <!-- CDN / EDGE -->
  <g id="edge" transform="translate(80,530)">
    <rect x="0" y="0" width="420" height="140" class="box"/>
    <text x="20" y="34" class="label">CDN Edge / WAF / Reverse Proxy</text>
    <text x="20" y="56" class="small">- Anycast DNS → nearest edge</text>
    <text x="20" y="76" class="small">- Cache hit: serve from edge</text>
    <text x="20" y="96" class="small">- Cache miss: forward to origin</text>
    <text x="20" y="116" class="small">- WAF inspects L7 for attacks</text>
  </g>

  <!-- LOAD BALANCER -->
  <g id="load-balancer" transform="translate(520,530)">
    <rect x="0" y="0" width="420" height="140" class="box"/>
    <text x="20" y="34" class="label">Load Balancer (L4 / L7)</text>
    <text x="20" y="56" class="small">- L4: TCP/UDP passthrough, hashing</text>
    <text x="20" y="76" class="small">- L7: HTTP routing (host/path), TLS termination</text>
    <text x="20" y="96" class="small">- Health checks, session affinity, draining</text>
  </g>

  <!-- FIREWALL / VPC -->
  <g id="firewall" transform="translate(960,530)">
    <rect x="0" y="0" width="420" height="140" class="box"/>
    <text x="20" y="34" class="label">Firewall / Security Groups / ACLs</text>
    <text x="20" y="56" class="small">- Stateless ACLs (ordered rules)</text>
    <text x="20" y="76" class="small">- Stateful Security Groups (conntrack)</text>
    <text x="20" y="96" class="small">- DPI / L7 rules, logging and alerts</text>
  </g>

  <!-- ORIGIN / APP SERVERS -->
  <g id="origin" transform="translate(80,720)">
    <rect x="0" y="0" width="380" height="360" class="box"/>
    <text x="20" y="34" class="label">Origin Infrastructure</text>
    <text x="20" y="56" class="small">- Web Servers (containers / VMs)</text>
    <text x="20" y="78" class="small">- App servers | API</text>
    <text x="20" y="100" class="small">- Service mesh / sidecars (mTLS)</text>

    <!-- internal components -->
    <rect x="410" y="0" width="380" height="160" class="box"/>
    <text x="430" y="34" class="label">Datastore / Cache</text>
    <text x="430" y="56" class="small">- DB (private subnet)</text>
    <text x="430" y="78" class="small">- Redis / Memcached</text>
    <text x="430" y="100" class="small">- Internal APIs</text>

    <!-- Bastion / SSH -->
    <rect x="820" y="0" width="320" height="160" class="edge"/>
    <text x="840" y="34" class="label">Bastion / Jump Host</text>
    <text x="840" y="56" class="small">- SSH (22): key-based auth</text>
    <text x="840" y="76" class="small">- Port forwarding, SFTP</text>

    <!-- Private network overlay / VPN -->
    <rect x="410" y="190" width="730" height="150" class="edge"/>
    <text x="430" y="218" class="label">VPN / Tunnels</text>
    <text x="430" y="240" class="small">- WireGuard / IPSec / OpenVPN</text>
    <text x="430" y="260" class="small">- Encapsulation: original IP carried inside encrypted payload</text>
    <text x="430" y="280" class="small">- Split-tunnel vs full-tunnel</text>
  </g>

  <!-- DATABASE / BACKEND -->
  <g id="db" transform="translate(520,1100)">
    <rect x="0" y="0" width="420" height="160" class="box"/>
    <text x="20" y="34" class="label">Primary DB / Storage</text>
    <text x="20" y="56" class="small">- Private subnet</text>
    <text x="20" y="76" class="small">- Access controlled by IAM / firewall</text>
    <text x="20" y="96" class="small">- Replication, backups, encryption at rest</text>

    <rect x="460" y="0" width="420" height="160" class="box"/>
    <text x="480" y="34" class="label">Monitoring / Logging / Tracing</text>
    <text x="480" y="56" class="small">- Metrics (Prometheus / Datadog)</text>
    <text x="480" y="76" class="small">- Logs (ELK, CloudWatch)</text>
    <text x="480" y="96" class="small">- Distributed Traces (OpenTelemetry / APM)</text>
  </g>

  <!-- Annotations and arrows: Client -> DNS -->
  <g id="arrows">
    <!-- Client to Local Router -->
    <line x1="360" y1="260" x2="420" y2="260" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="248" class="protocol">ARP / Local NAT</text>

    <!-- Client DNS to Recursive Resolver -->
    <line x1="180" y1="170" x2="420" y2="170" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="158" class="protocol">DNS query (UDP/53) or DoH/DoT</text>

    <!-- Resolver -> Internet -->
    <line x1="840" y1="320" x2="880" y2="340" stroke="#16a085" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="720" y="300" class="protocol">Authoritative lookups / Anycast</text>

    <!-- Client -> Internet (via NAT) -->
    <line x1="360" y1="300" x2="700" y2="360" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="460" y="322" class="protocol">IP packet (IPv4/IPv6) → default gateway</text>

    <!-- Internet to CDN edge -->
    <line x1="980" y1="420" x2="500" y2="610" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="720" y="520" class="protocol">Routing (BGP) → CDN / Edge</text>

    <!-- CDN -> LB -->
    <line x1="500" y1="670" x2="520" y2="670" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="440" y="690" class="protocol">HTTP(S) request (TLS handshake if HTTPS)</text>

    <!-- LB -> Firewall -->
    <line x1="940" y1="670" x2="960" y2="670" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="880" y="690" class="protocol">Forward to VPC / Security Group</text>

    <!-- Firewall -> Origin -->
    <line x1="1180" y1="670" x2="1200" y2="820" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="980" y="760" class="protocol">Filtering / conntrack → chosen backend</text>

    <!-- LB -> Origin (alternate arrow) -->
    <line x1="720" y1="670" x2="480" y2="820" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
    <text x="540" y="720" class="protocol">L7 routing: host/path, sticky sessions</text>

    <!-- Origin -> DB -->
    <line x1="320" y1="1080" x2="540" y2="1100" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="1066" class="small">SQL / NoSQL over private network (mTLS optional)</text>

    <!-- Origin -> Bastion (SSH) -->
    <line x1="240" y1="940" x2="880" y2="920" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="440" y="900" class="protocol">Admin access via SSH (key auth)</text>

    <!-- VPN tunnel (two directional) -->
    <path d="M560 970 C660 930 760 930 860 970" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M860 1120 C760 1160 660 1160 560 1120" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="700" y="1046" class="protocol">VPN tunnel (WireGuard / IPSec): encapsulation and encryption</text>

    <!-- CDN cache hit path -->
    <path d="M500 690 C300 760 200 880 360 920" fill="none" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
    <text x="320" y="800" class="note">On cache-hit: CDN returns response directly</text>

    <!-- Response path back to client -->
    <line x1="540" y1="1300" x2="360" y2="340" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="420" y="960" class="protocol">Response packets follow reverse path; TLS records decrypted at client</text>
  </g>

  <!-- Side panels with detailed per-flow states -->
  <g id="details" transform="translate(60,1370)">
    <rect x="0" y="0" width="1480" height="760" class="edge"/>

    <text x="20" y="34" class="section-title">Detailed Flow States and Notes</text>

    <!-- DNS detail -->
    <rect x="20" y="60" width="700" height="160" class="box"/>
    <text x="40" y="92" class="label">DNS Resolution (state-by-state)</text>
    <text x="40" y="116" class="small">1. Check local cache (OS/browser) → TTL</text>
    <text x="40" y="136" class="small">2. Stub → Recursive resolver (UDP/53 or DoH/DoT)</text>
    <text x="40" y="156" class="small">3. Recursive: root → TLD → Authoritative (iterative)</text>
    <text x="40" y="176" class="small">4. Handle CNAME, glue records, DNSSEC validation</text>

    <!-- TCP / TLS detail -->
    <rect x="760" y="60" width="740" height="160" class="box"/>
    <text x="780" y="92" class="label">TCP / TLS Handshake and States</text>
    <text x="780" y="116" class="small">TCP 3-way: SYN → SYN-ACK → ACK → ESTABLISHED</text>
    <text x="780" y="136" class="small">TLS 1.3 handshake: ClientHello → ServerHello → Encrypted traffic</text>
    <text x="780" y="156" class="small">TLS termination points: Edge (LB) or End-to-End (origin)</text>

    <!-- HTTP -->
    <rect x="20" y="240" width="700" height="160" class="box"/>
    <text x="40" y="272" class="label">HTTP / HTTPS Flow</text>
    <text x="40" y="296" class="small">1. Request over established TCP/TLS session</text>
    <text x="40" y="316" class="small">2. HTTP/2: multiplexed streams, HTTP/3: QUIC over UDP</text>
    <text x="40" y="336" class="small">3. Caching: Cache-Control, ETag, If-None-Match</text>

    <!-- LB & Health checks -->
    <rect x="760" y="240" width="740" height="160" class="box"/>
    <text x="780" y="272" class="label">Load Balancer</text>
    <text x="780" y="296" class="small">- Health checks (HTTP/TCP) determine backend availability</text>
    <text x="780" y="316" class="small">- Session affinity: cookies or IP-based</text>
    <text x="780" y="336" class="small">- Graceful draining during deployments</text>

    <!-- Firewall & NAT -->
    <rect x="20" y="420" width="700" height="140" class="box"/>
    <text x="40" y="452" class="label">Firewalls, ACLs and NAT</text>
    <text x="40" y="476" class="small">- Stateful firewall tracks flows (conntrack)</text>
    <text x="40" y="496" class="small">- Network ACLs are stateless; order matters</text>
    <text x="40" y="516" class="small">- NAT/PAT: private:port → public:ephemeral-port mapping</text>

    <!-- VPN & Tunneling detail -->
    <rect x="760" y="420" width="740" height="140" class="box"/>
    <text x="780" y="452" class="label">VPN / Tunneling Details</text>
    <text x="780" y="476" class="small">- Handshake and key negotiation (IKE / DTLS / WireGuard)</text>
    <text x="780" y="496" class="small">- Encap: original IP packet becomes payload of encrypted packet</text>
    <text x="780" y="516" class="small">- MTU reduction; avoid fragmentation by adjusting MSS/PMTU</text>

    <!-- Proxies & CONNECT -->
    <rect x="20" y="580" width="700" height="120" class="box"/>
    <text x="40" y="612" class="label">Proxies (Forward / Reverse)</text>
    <text x="40" y="636" class="small">- Forward proxy: outbound control, caching, filtering</text>
    <text x="40" y="656" class="small">- Reverse proxy: TLS termination, routing, WAF</text>
    <text x="40" y="676" class="small">- CONNECT establishes TCP tunnel for HTTPS via proxy</text>

    <!-- PKI / SSL lifecycle -->
    <rect x="760" y="580" width="740" height="120" class="box"/>
    <text x="780" y="612" class="label">PKI and SSL Certificate Lifecycle</text>
    <text x="780" y="636" class="small">- Generate keypair and CSR → CA issues cert</text>
    <text x="780" y="656" class="small">- Client validates cert chain (OCSP/CRL, CT logs)</text>
    <text x="780" y="676" class="small">- Renew before expiry; revoke on compromise</text>
  </g>

  <!-- Footer / Legend -->
  <g id="legend" transform="translate(60,2160)">
    <rect x="0" y="0" width="1480" height="40" class="edge"/>
    <text x="20" y="26" class="small">Legend: Arrows show packet/connection flow. Colors indicate logical layers: DNS (green), IP routing (blue), CDN/LB (purple/red), Security (dark), Control planes and monitoring (grey).</text>
  </g>

  <!-- Accessibility: add title/desc -->
  <title>Network Flow Diagram</title>
  <desc>SVG diagram showing detailed network flow from client through DNS, internet, CDN, load balancer, firewall, origin, database, and auxiliary services with per-step annotations for DNS, TCP/TLS, HTTP, VPN, SSH, NAT, and PKI lifecycle.</desc>
</svg>
